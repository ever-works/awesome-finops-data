markdown: >-
  ## Overview


  Sedai is billed as the world's first self-driving cloud platform — an
  AI-powered system that helps teams manage their cloud infrastructure with less
  manual work and more automation. Instead of tuning resource settings, chasing
  performance issues, or juggling cost vs. speed by hand, Sedai continually
  learns how infrastructure is used and optimizes accordingly.


  ## Features


  - Customizable Dashboards

  - Resource Optimization

  - Savings Recommendations

  - Reserved Instance Management

  - Budget Management

  - Detailed Reporting

  - Automated Cost Policies

  - Access Controls
