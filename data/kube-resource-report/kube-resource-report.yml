markdown: >-
  ## Overview


  kube-resource-report is an open-source tool that reports Kubernetes cluster
  and pod resource requests versus usage and generates static HTML reports.


  ## Features


  - Reports Kubernetes cluster and pod resource requests vs usage

  - Generates static HTML reports

  - Designed for Kubernetes cost visibility and FinOps reporting


  ## Pricing


  Free and open-source.


  ## Deployment


  Self-hosted; runs on Kubernetes clusters.
