markdown: >-
  ## Overview


  Parsivex is an AWS cost waste scanning service that identifies idle and
  over-provisioned resources.


  ## Features


  - Scans for idle EC2 instances

  - Detects unattached EBS volumes

  - Identifies oversized RDS databases

  - Finds stale snapshots

  - Detects NAT gateway overuse

  - Monthly waste totals with category breakdown


  ## Pricing


  - Free tier: monthly scan for one AWS account with total monthly waste and
  category breakdown

  - Paid plans: itemized findings and scheduled re-scans


  ## Deployment


  Cloud-based SaaS.
