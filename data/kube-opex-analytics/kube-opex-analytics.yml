markdown: >-
  ## Overview


  kube-opex-analytics is an open-source tool to help organizations track the
  resources being consumed by their Kubernetes clusters to prevent overpaying.


  ## Features


  - Tracks resources consumed by Kubernetes clusters

  - Supports Kubernetes cost monitoring and FinOps visibility

  - Helps prevent cloud overpaying


  ## Pricing


  Free and open-source.


  ## Deployment


  Self-hosted; runs on Kubernetes clusters.
