markdown: >-
  ## Overview


  CloudHealth is an enterprise-grade, policy-driven cloud cost governance
  platform. Following Broadcom's acquisition of VMware's CloudHealth division,
  the platform offers enterprise features but introduced some uncertainty around
  the roadmap and pricing. It provides solid multi-cloud visibility and
  customizable governance policies.


  ## Key Features


  - Enterprise-grade policy-driven cost governance

  - Solid multi-cloud visibility across AWS, Azure, and GCP

  - Customizable governance policies

  - Budget tracking and forecasting

  - Cost allocation for finance teams

  - Executive reporting and dashboards

  - Integration with ITSM tools and financial systems


  ## Platform Engineering Fit


  CloudHealth is best suited for organizations that prioritize financial
  governance and executive visibility over developer self-service. It integrates
  better with ITSM tools and financial systems than developer portals and GitOps
  workflows. Platform engineers may find fewer developer-facing features
  compared to cloud-native and developer-focused alternatives.


  ## Pricing Model


  Paid enterprise platform. Pricing varies based on cloud spend and features.
  Contact Broadcom/VMware for specific pricing.


  ## Deployment


  Cloud-based SaaS platform with multi-cloud support.
