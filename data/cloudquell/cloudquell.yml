name: CloudQuell
description: CloudQuell brings AWS, OpenAI, Anthropic, and Snowflake costs
  together in one view, attributing them to teams via cost centers, rules, and
  tags. It offers anomaly detection, budgets, rightsizing recommendations, cost
  visualization, and showback. A free plan is available, with Starter at
  $99/month and Growth at $199/month.
