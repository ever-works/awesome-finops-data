markdown: >-
  ## Overview


  Bring AWS, OpenAI, Anthropic, and Snowflake costs together in one ledger.
  Attribute costs to the teams behind them with cost centers, rules, and tags,
  and stay ahead of spend using anomaly detection, budgets, and a ranked set of
  savings opportunities.


  ## Features


  - Activity Dashboard

  - Cost Comparison

  - Spending Alerts

  - Rightsizing Recommendations

  - Cost Alerts

  - Cost Visualization

  - Showback

  - Cost Tagging


  ## Pricing


  - Free: $0 Monthly Flat

  - Starter: $99 Monthly (14-day)

  - Growth: $199 Monthly (14-day)
