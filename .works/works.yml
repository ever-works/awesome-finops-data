company_name: Awesome FinOps
content_table: true
item_name: Item
items_name: Items
paging_mode: paging
copyright_year: 2026
name: Awesome FinOps
initial_prompt: >-
  A curated directory of cloud cost management, Kubernetes cost and FinOps
  tools. Include products such as Vantage, CloudZero, Kubecost, OpenCost,
  Infracost, ProsperOps, nOps, CAST AI, Finout, Ternary, Apptio Cloudability,
  Harness Cloud Cost Management, plus other notable commercial and open-source
  options. Categories: Cloud Cost Management, Kubernetes Cost, Commitment &
  Savings Automation, IaC Cost Estimation, Open-Source FinOps, Chargeback &
  Billing. For every item capture the official website, a short factual
  description, pricing model (free, freemium, paid, open source), deployment
  (cloud or self-hosted), key features and integrations.


  Initial categories: Cloud Cost Management; Kubernetes Cost; Commitment &
  Savings Automation; IaC Cost Estimation; Open-Source FinOps; Chargeback &
  Billing.

  Target keywords: finops tools, cloud cost management, cloud cost optimization,
  kubernetes cost monitoring.


  Start with these source lists (use the raw README link for GitHub lists):

  - https://www.finops.org/landscape/

  - https://www.softwaresuggest.com/cloud-cost-management-software

  - https://raw.githubusercontent.com/jmfontaine/awesome-finops/HEAD/README.md

  - https://raw.githubusercontent.com/cloudfinops/awesome-finops/HEAD/README.md

  - https://github.com/ripienaar/free-for-dev#cloud-management-solutions

  - https://github.com/topics/finops


  Inclusion rules: every item is a real product, service, open-source project or
  platform in scope; never a statistic, quote, blog post, person or general
  concept.

  One item per product. The item URL is the official website (never an affiliate
  link, review-site page or "top 10" article). Skip discontinued products and
  sites that no longer resolve.

  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for
  open source state the license and link the repository.

  Each item gets exactly one primary category from the initial categories; do
  not create near-duplicate categories.

  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid,
  Enterprise, API, AI-Powered, plus niche-specific ones.

  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt,
  SourceForge/Slashdot, There's An AI For That or Toolify as sources.
website_repo: ever-works/awesome-finops-website
company_website: https://finops.ever.works
